# ============================================================
# CosyVoice TTS API — 华为 NPU 910B Docker Compose
#
# 与 GPU 版 (docker-compose.uv.yml) 的差异:
#   - 设备映射: /dev/davinci{N} (非 NVIDIA GPU)
#   - 驱动挂载: 宿主机 NPU 驱动
#   - 启动文件: app_npu.py (非 app.py)
#   - 代码挂载: cosyvoice2_npu.py, model_npu.py
#   - LOAD_JIT/TRT=false (NPU 不支持)
#
# ★★★ v5 推理方案变更 (重要) ★★★
#   v3/v4 的自研 NPU Fused Attention 有早停 bug, 已废弃。
#   v5 默认 LOAD_VLLM=true, 使用 vLLM-Ascend 生产级 NPU 推理引擎。
#
#   首次启动会自动导出 BF16 模型到:
#     pretrained_models/CosyVoice2-0.5B/vllm/
#   导出后续启动可直接复用 (大约耗时 30-60s)。
#
# 使用:
#   # 生产模式 (v5 默认 vLLM)
#   docker compose -f docker-compose.npu.yml up -d
#
#   # Fallback: 若 vLLM 跑不通, 回退到 v4 NPU optimizer
#   LOAD_VLLM=false docker compose -f docker-compose.npu.yml up -d
#
#   # 冒烟测试 (在容器内)
#   docker exec -it cosyvoice-tts python /workspace/CosyVoice/scripts/smoke_vllm_npu.py
#
#   # 调试模式 (进容器手动装包/启动)
#   NPU_MODE=debug docker compose -f docker-compose.npu.yml up -d
#   docker exec -it cosyvoice-tts bash
# ============================================================

services:
  cosyvoice-tts:
    build:
      context: .
      dockerfile: Dockerfile.npu
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
    image: cosyvoice-tts-api:npu
    container_name: cosyvoice-tts
    restart: unless-stopped

    # ── 网络模式 ──
    # 调试: network_mode: host (访问内网 pip 源)
    # 生产: 自定义网络 + ports 映射
    network_mode: ${NPU_NETWORK_MODE:-bridge}

    # ── NPU 设备映射 ──
    # NPU_DEVICE_ID: 要使用的 NPU 卡号 (默认 0)
    # 多卡: 添加多个 /dev/davinci{N}
    devices:
      - /dev/davinci${NPU_DEVICE_ID:-0}:/dev/davinci${NPU_DEVICE_ID:-0}
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc

    volumes:
      # ── NPU 驱动 (宿主机挂载, 必须) ──
      - /usr/local/dcmi:/usr/local/dcmi
      - /usr/local/Ascend/driver/tools/hccn_tool:/usr/local/Ascend/driver/tools/hccn_tool
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi
      - /usr/local/Ascend/driver/lib64/:/usr/local/Ascend/driver/lib64/
      - /usr/local/Ascend/driver/version.info:/usr/local/Ascend/driver/version.info
      - /etc/ascend_install.info:/etc/ascend_install.info

      # ── 模型 ──
      - ${MODEL_HOST_DIR:-./pretrained_models}:/workspace/CosyVoice/pretrained_models

      # ── wetext 缓存 ──
      - ${WETEXT_CACHE_DIR:-./pengzhendong/wetext}:/root/.cache/modelscope/hub/pengzhendong/wetext

      # ── Matcha-TTS submodule ──
      - ./Matcha-TTS:/workspace/CosyVoice/third_party/Matcha-TTS

      # ── 说话人 (镜像内已包含, 不挂载宿主机目录) ──
      # - ./speakers:/workspace/CosyVoice/speakers

      # ── NPU 专用代码热更新 ──
      # 注意: 这里挂载的是 NPU 版本, 与 GPU 版完全分离
      - ./app_npu.py:/workspace/CosyVoice/app_npu.py
      - ./npu_optimizer.py:/workspace/CosyVoice/npu_optimizer.py
      - ./cosyvoice2_npu.py:/workspace/CosyVoice/cosyvoice/vllm/cosyvoice2.py
      # ── 运维/诊断脚本 (v5 vLLM 冒烟测试用) ──
      - ./scripts:/workspace/CosyVoice/scripts

      # ── 输出 ──
      - ./logs:/workspace/CosyVoice/logs

    environment:
      - MODEL_DIR=${MODEL_DIR:-pretrained_models/CosyVoice2-0.5B}
      - HOST=0.0.0.0
      - PORT=8080
      - MAX_CONCURRENCY=${MAX_CONCURRENCY:-4}
      # ── NPU 卡可见性 (CANN runtime 需要) ──
      # 必须与 devices 段挂载的 /dev/davinciN 卡号一致
      - ASCEND_RT_VISIBLE_DEVICES=${NPU_DEVICE_ID:-0}
      # ══════════════════════════════════════════════════════════
      #  ★★★ 推理引擎选择 (v5 推荐: vLLM-Ascend) ★★★
      # ══════════════════════════════════════════════════════════
      # v3/v4 自研 NPU Fused Attention 实测有早停 bug
      # (speech_len 仅为正常 24-50%, 见 git log)。
      # v5 切换到生产级方案：vLLM-Ascend
      #   - 华为/vLLM 团队官方维护，质量无损
      #   - 内置 PagedAttention + Continuous Batching
      #   - 模型首次启动会自动导出 BF16 到 pretrained_models/.../vllm
      # ── NPU 优化参数 ──
      - LOAD_JIT=false            # NPU 不支持 TorchScript JIT
      - LOAD_TRT=false            # TensorRT 是 NVIDIA 专有
      - LOAD_VLLM=${LOAD_VLLM:-true}   # ★ v5 默认开启 vLLM-Ascend
      - FP16=${FP16:-true}        # NPU 910B 推荐 FP16
      # ── Flow 优化参数 (vLLM 模式下也生效，因为只优化非 LLM 模块) ──
      # 注意: LOAD_VLLM=true 时 npu_optimizer 不会加载 (app_npu.py:675)
      #       Flow 优化只在 LOAD_VLLM=false 的 fallback 路径生效
      - NPU_FLOW_TIMESTEPS=${NPU_FLOW_TIMESTEPS:-4}  # Flow ODE 步数 (3-6, 越少越快)
      - NPU_DISABLE_CFG=${NPU_DISABLE_CFG:-true}     # CFG-free 推理 (batch 2→1)
      - NPU_PROFILE=${NPU_PROFILE:-false}            # 模块级耗时诊断 (调优用)
      - NPU_COMPILE=${NPU_COMPILE:-false}            # torch.compile flow.estimator (实验)
      # ── 自研 LLM 优化 (★ 已废弃，仅在 LOAD_VLLM=false 时生效) ──
      # 历史教训:
      #   - NPU_FORCE_LLM_FP16: 实测无效
      #   - NPU_COMPILE_LLM:    实测反而慢
      #   - NPU_FUSED_ATTN:     有早停 bug, 无法根治
      # 保留仅供 vLLM 跑不通时 fallback 用
      - NPU_FORCE_LLM_FP16=${NPU_FORCE_LLM_FP16:-false}
      - NPU_COMPILE_LLM=${NPU_COMPILE_LLM:-false}
      - NPU_FUSED_ATTN=${NPU_FUSED_ATTN:-false}      # ★ v5 默认关，避免早停
      - NPU_FUSED_ATTN_MODE=${NPU_FUSED_ATTN_MODE:-all}
      - NPU_FUSED_ATTN_DEBUG=${NPU_FUSED_ATTN_DEBUG:-false}
      - NPU_FUSED_ATTN_DEBUG_N=${NPU_FUSED_ATTN_DEBUG_N:-8}
      - NPU_FUSED_ATTN_LAYERS=${NPU_FUSED_ATTN_LAYERS:-skip_last_4}
      - NPU_FUSED_ATTN_INNER_PRECISE=${NPU_FUSED_ATTN_INNER_PRECISE:-0}
      - NPU_FUSED_ATTN_DECODE_SPARSE=${NPU_FUSED_ATTN_DECODE_SPARSE:-0}
      # ── vLLM NPU 专用 ──
      - VLLM_WORKER_MULTIPROC_METHOD=spawn  # NPU 必须用 spawn
      - VLLM_USE_V1=${VLLM_USE_V1:-1}       # 强制 V1 引擎 (vLLM 0.17 默认)

    # ── 生产模式 (默认) ──
    command: ["python", "-m", "uvicorn", "app_npu:app",
              "--host", "0.0.0.0", "--port", "8080",
              "--workers", "1", "--log-level", "info",
              "--timeout-keep-alive", "300"]

    # ── 调试模式 (取消注释, 注释上面的 command) ──
    # command: ["sleep", "infinity"]

    ports:
      - "${API_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

    shm_size: "4g"

    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"